schema_version: 1

# These levels describe what the evidence proves.  They are deliberately
# stricter than a successful Maven build or a clean plugin enable.
status_levels:
  BOOT:
    definition: "The plugin enables, disables, and reloads cleanly in the pinned environment."
    required_checks:
      - enable_clean
      - disable_clean
      - reload_clean
      - no_linkage_errors
  CORE:
    definition: "The plugin's core API smoke checks pass after BOOT."
    required_checks:
      - boot
      - core_api
  PACKET_BEHAVIOR:
    definition: "The scoped send, receive, cancel, modify, and async packet checks pass."
    required_checks:
      - core
      - send
      - receive
      - cancel
      - modify
      - async
      - ordering
  FULLY_TESTED:
    definition: "CORE and PACKET_BEHAVIOR pass, plus reconnect and restart with no known regression in this exact scope."
    required_checks:
      - core
      - packet_behavior
      - reconnect
      - restart
      - no_known_regression

evidence_contract:
  result_values:
    - PASS
    - FAIL
    - BLOCKED
    - NOT_RUN
  required_fields:
    - schema_version
    - run_id
    - started_at
    - environment
    - plugin
    - result
    - status_level
    - checks
    - artifact_sha256
    - log_sha256
  promotion_rules:
    BOOT: "Every required BOOT check must be PASS in one pinned environment."
    CORE: "BOOT plus every required CORE check must be PASS in one pinned environment."
    PACKET_BEHAVIOR: "CORE plus every required packet check must be PASS; NOT_RUN is not accepted."
    FULLY_TESTED: "PACKET_BEHAVIOR plus reconnect and restart must be PASS for the same exact versions."

